name: Test CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:

  linter:
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.11]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          prune-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install project
        run: uv sync
      - name: Run linter
        run: uv run ruff check
      - name: Run format check
        run: uv run ruff format --check

  testing:
    needs: linter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        django-version: ['django52', 'django42']
        package: [
          'ap-core',
          'ap-codegen',
          'ap-frontend',
          'ap-storage',
          'ap-audit',
          'ap-ui',
          'ap-pdf',
          'ap-server-choices',
          'ap-ordered-model'
        ]
        exclude:
          - python-version: '3.14'
            django-version: 'django42'

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_OVERRIDE: constraints/${{ matrix.django-version }}.txt
      UV_NO_SYNC: 1

    services:
      postgres:
        # Docker Hub image
        image: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
        env:
          # Override Django DB settings
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          prune-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install node dependencies (required for prettier formatting in tests)
        run: yarn install

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies for ${{ matrix.package }}
        run: |
          PKG="${{ matrix.package }}"
          PACKAGE_NAME="alliance-platform-${PKG#ap-}"
          # Install package and all dependencies including dev group (Django version controlled by UV_OVERRIDE)
          uv export --no-hashes --package "$PACKAGE_NAME" | uv pip install -r -
          # Install coverage for test reporting
          uv pip install 'coverage[toml]>=7.0'

      - name: Check if Playwright is needed
        id: check-playwright
        run: |
          if uv pip list | grep -q "^playwright "; then
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "Playwright detected in dependencies"
          else
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "Playwright not needed for this package"
          fi

      - name: Cache Playwright browsers
        if: steps.check-playwright.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright browsers
        if: steps.check-playwright.outputs.needed == 'true'
        run: uv run playwright install --with-deps

      - name: Test ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: |
          uv run coverage run --source=alliance_platform ./manage.py test
          uv run coverage report
          uv run coverage xml
        env:
          CI_SERVER: yes
          DB_HOST: localhost
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: postgres_${{ matrix.package }}_py${{ matrix.python-version }}_${{ matrix.django-version }}
          NODE_MODULES_DIR: ${{ github.workspace }}/node_modules

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/${{ matrix.package }}/coverage.xml
          flags: ${{ matrix.package }},py${{ matrix.python-version }},${{ matrix.django-version }}
          name: ${{ matrix.package }}-py${{ matrix.python-version }}-${{ matrix.django-version }}
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.package }}-py${{ matrix.python-version }}-${{ matrix.django-version }}
          path: |
            packages/${{ matrix.package }}/**/*.log
            packages/${{ matrix.package }}/coverage.xml
          if-no-files-found: ignore

  testing-dev:
    needs: linter
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, macos-latest]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_NO_SYNC: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          prune-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install tmux on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes tmux
      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Create isolated test environment
        run: |
          uv venv
          uv export --no-hashes --package alliance-platform-dev | uv pip install -r -
          uv pip install 'coverage[toml]>=7.0' mypy build
      - name: Test ap-dev
        working-directory: packages/ap-dev
        run: |
          uv run coverage run --source=alliance_platform -m unittest discover -s tests -p 'test_*.py'
          uv run coverage report
          uv run coverage xml
      - name: Type check ap-dev
        working-directory: packages/ap-dev
        run: uv run mypy .
      - name: Build and smoke-test wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          uv build --package alliance-platform-dev --wheel
          wheel=$(find dist -name 'alliance_platform_dev-*.whl' -print -quit)
          unzip -l "$wheel" | tee /tmp/ap-dev-wheel.txt
          grep -q 'alliance_platform/dev/py.typed' /tmp/ap-dev-wheel.txt
          if grep -qE '(^|/)tests/|tools/dev|\.venv/' /tmp/ap-dev-wheel.txt; then exit 1; fi
          consumer=$(mktemp -d)
          (cd "$consumer" && uvx --isolated --no-env-file --from "$GITHUB_WORKSPACE/$wheel" alliance-dev --version)
          test ! -e "$consumer/.venv"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/ap-dev/coverage.xml
          flags: ap-dev,py${{ matrix.python-version }},${{ runner.os }}
          name: ap-dev-py${{ matrix.python-version }}-${{ runner.os }}
          fail_ci_if_error: false
